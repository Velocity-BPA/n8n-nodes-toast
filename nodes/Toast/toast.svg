<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="toastGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E55A2B"/>
    </linearGradient>
  </defs>
  <!-- Toast slice background -->
  <rect x="15" y="25" width="70" height="55" rx="8" ry="8" fill="url(#toastGradient)"/>
  <!-- Toast crust top -->
  <rect x="15" y="20" width="70" height="12" rx="6" ry="6" fill="#D4A574"/>
  <!-- Toast highlight -->
  <rect x="22" y="35" width="56" height="8" rx="4" fill="#FFB088" opacity="0.6"/>
  <rect x="22" y="50" width="40" height="6" rx="3" fill="#FFB088" opacity="0.4"/>
  <!-- Steam lines -->
  <path d="M30 15 Q35 10 30 5" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50 12 Q55 7 50 2" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M70 15 Q75 10 70 5" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Plate -->
  <ellipse cx="50" cy="85" rx="40" ry="8" fill="#E8E8E8"/>
  <ellipse cx="50" cy="83" rx="35" ry="6" fill="#F5F5F5"/>
</svg>
